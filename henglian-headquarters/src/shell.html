<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef1f2"><title>衡联总部 · 精修第二版</title><style>__STYLE__</style></head><body>
<div id="viewport" aria-label="衡联总部可交互三维模型"></div>
<header><div class="brand"><svg viewBox="0 0 38 42" aria-hidden="true"><path d="M2 39h34M7 38V21h5V10h5V3h8v11h5v24M17 4v34m8-23v23M8 24h4m-4 5h4m-4 5h4m7-21h3m-3 6h3m-3 6h3m-3 6h3"/></svg><span>衡联总部<small>HENGLIAN CAMPUS / CORPORATE COLLECTION</small></span></div><div class="edition">千人小镇 <i>/</i> 总部档案 013 · DETAIL 02</div><button id="export">导出完整模型 <b>↗</b></button></header>
<nav class="views" aria-label="观察视角"><button data-view="overview" class="active">总览</button><button data-view="front">正立面</button><button data-view="top">俯视</button><button data-view="low">仰视</button><button data-view="entrance">入口</button><button data-view="garden">庭院</button><button data-view="roof">屋顶</button><button data-view="bridge">连廊</button><button data-view="steps">台阶</button><button data-view="stairs">楼梯</button><button data-view="trees">树木</button><button data-view="grass">草坪</button><button data-view="main">主楼</button><button data-view="annex">辅楼</button></nav>
<section class="intro"><span class="eyebrow">TWO VOLUMES. ONE CONNECTION.</span><h1>两座之间，<br>协作相连。</h1><p>银色框架，勾勒秩序。<br>一条空中廊道，连接共同的远景。</p><div class="measure"><span><b>100</b><small>主楼高度 / m</small></span><span><b>37</b><small>连廊标高 / m</small></span></div><div class="parcel">112 × 112 m <span>标准方形地块</span></div></section>
<aside aria-label="模型控制"><button id="collapse" aria-controls="panel-body" aria-expanded="true"><span><small>LIGHT & MOTION</small>光影与城市</span><b id="collapse-icon">−</b></button><div id="panel-body">
<div class="row"><label for="time">光照环境</label><output id="clock">08:30</output></div><select id="time"><option value="morning">晨光 · 清蓝庭院</option><option value="day">白昼 · 清晰日光</option><option value="evening">黄昏 · 暖金反射</option><option value="night">夜景 · 城市灯火</option><option value="white">白底 · 建筑展示</option></select>
<div class="pair"><button id="projection" aria-pressed="true">正交视图</button><button id="free" aria-pressed="false">自由视角</button></div>
<div class="divider"></div><div class="row"><label for="part">建筑与构件</label><button id="reset" class="text">返回全景 ↗</button></div><select id="part"><option value="">选择主楼 / 辅楼 / 连廊</option></select><p id="selection-note">双击模型定位 · 可独立查看构件</p><div class="pair"><button id="isolate" disabled>独立观察</button><button id="export-part" disabled>导出构件 ↗</button></div>
<div class="divider"></div><div class="row"><label for="quality">画面品质</label><select id="quality"><option value="high">完整细节</option><option value="medium">均衡</option><option value="low">流畅</option></select></div><div class="row"><label for="speed">动态速度</label><output id="speed-value">1.00×</output></div><input id="speed" aria-label="动态速度" type="range" min="0" max="2" value="1" step=".25">
<label class="switch">植物与云层<input id="wind" type="checkbox" checked></label><label class="switch">总部员工<input id="people" type="checkbox" checked></label><label class="switch">庭院飞鸟<input id="birds" type="checkbox" checked></label><label class="switch">电梯与风机<input id="mechanical" type="checkbox" checked></label>
<label class="switch">连廊通行<input id="bridge" type="checkbox" checked></label><button id="pause" class="primary" aria-pressed="false">暂停动态</button><button id="capture" class="capture">保存当前画面 <b>↗</b></button><p class="caption">银灰幕墙 / 双楼总部 / 空中连廊<br>商务广场 / 会议花园 / 平屋顶机电</p></div></aside>
<div class="scale-bar"><span>0</span><i></i><span>20 m</span></div><footer><span id="gesture">拖拽旋转 · 右键平移 · 滚轮缩放</span><span class="live"><b></b>实时三维 <span id="stats"></span></span></footer><div id="loading"><span>衡联总部<small>正在展开建筑档案…</small></span></div><script>__APP__</script></body></html>
