<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee9dc"><title>暖庭花园 · 把午后留给花园</title><style>__STYLE__</style></head>
<body>
<div id="viewport" aria-label="暖庭花园三维模型"></div>
<header><div class="brand"><svg viewBox="0 0 42 42" aria-hidden="true"><path d="M5 35V19L15 11l10 8v16M9 17V9h5v4m11 22V13l8-6 6 6v22M2 35h38M11 24h7v11M29 18h5m-5 6h5m-5 6h5"/></svg><span>暖庭花园<small>NUANTING GARDEN · RESIDENCES</small></span></div><span class="edition">千人小镇 · 花园洋房 / 10</span><button id="export" class="export">导出完整模型 <span>↗</span></button></header>
<nav class="views" aria-label="观察视角"><button data-view="overview" class="active">全景</button><button data-view="top">俯视</button><button data-view="entrance">入口</button><button data-view="garden">花园</button><button data-view="roof">屋顶</button><button data-view="facade">立面</button></nav>
<section class="intro"><span class="eyebrow">AN AFTERNOON AT HOME</span><h1>把午后，<br>留给花园。</h1><p>暖墙，坡屋顶，窗前的一树绿。<br>日常慢下来，家便有了形状。</p><div class="site-note"><b>112 <i>×</i> 112</b><span>米 / 四栋花园洋房</span></div></section>
<aside aria-label="模型设置"><button id="collapse" aria-expanded="true" aria-controls="panel-body"><span><small>LIGHT & LIFE</small>光与日常</span><span id="collapse-icon">−</span></button>
<div id="panel-body"><div class="time-row"><label for="time">光照时段</label><span id="clock">15:30</span></div><select id="time"><option value="afternoon">午后 · 温暖长影</option><option value="evening">黄昏 · 灯火初上</option><option value="night">夜间 · 静谧庭院</option></select>
<div class="divider"></div><div class="row"><label for="building">建筑观察</label><button id="reset" class="text-button">返回全景 ↗</button></div><select id="building"><option value="">选择一栋洋房</option></select><div class="building-views" aria-label="独立建筑视角"><button data-view="A">A</button><button data-view="B">B</button><button data-view="C">C</button><button data-view="D">D</button></div><p id="selection-note">轻触建筑，查看一栋家的细节</p><div class="pair"><button id="inspect" disabled>单栋观察</button><button id="export-selected" disabled>导出单栋 ↗</button></div>
<div class="divider"></div><div class="row"><label for="quality">画面品质</label><select id="quality"><option value="high">完整细节</option><option value="medium">均衡</option><option value="low">流畅</option></select></div><div class="row"><label for="speed">日常速度</label><output id="speed-value">1.00×</output></div><input id="speed" type="range" min="0" max="2" step=".25" value="1" aria-label="动态速度"><label class="switch">植物与窗前风动<input id="wind" type="checkbox" checked></label><label class="switch">居民日常<input id="people" type="checkbox" checked></label><label class="switch">内部车辆<input id="vehicles" type="checkbox" checked></label><button id="pause" class="pause" aria-pressed="false">暂停日常</button><button id="capture" class="capture">保存这一刻 <span>↗</span></button><p class="caption">暖黄色真石漆 · 灰褐色坡屋顶<br>4 / 5 / 5 / 6 层 · 低密度组团</p></div></aside>
<footer><span>拖拽旋转 <i>·</i> 右键平移 <i>·</i> 滚轮缩放</span><span class="live"><b></b> 实时三维 <span id="stats"></span></span></footer><div id="loading"><span>暖庭花园<small>正在铺开一段午后的日常…</small></span></div><script>__APP__</script></body></html>
